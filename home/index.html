    <script>
        // --- page functionality
        var currentPage = ""
        var sidebarPages = Array.from(document.getElementById("side-bar").children).map((tab) => {
            try {
                return tab.attributes.onclick.value.match(/'(.+)'/)[1]
            } catch (error) {
                return null
            }
        })

        function loadPage(page, addToHistory = true) {

            if (addToHistory) {
                window.history.pushState(page, "", `#${page}`);
            } else {}

            // dealing with unknown history state
            if (history.state == null) {
                // check url hash
                page = window.location.hash.slice(1)
            }


            if (page == "") {
                page = "intro"
                window.history.replaceState(page, "", `#${page}`);
            }
            console.log(`attempting to load page ${page}`)
            currentPage = page

            var target = null
            if (event) target = event.target
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                if (this.status == 200) {
                    //clear selection
                    clearSelection()

                    //set page title
                    setPageTitle(page.replaceAll("/", " > "))

                    //add selection effect to sidebar 
                    markActive(page)

                    //load content
                    document.getElementById("content-area").innerHTML = this.responseText;

                } else {
                    //clear selection
                    clearSelection()

                    //'load' 404
                    document.getElementById("content-area").innerHTML = `
                    <div id="page-bg"><h1 id="page-title" data-label="404 ERROR">404 ERROR</h1></div>
                    <img height="250px" class="floor" src="/res/img/hero/test2B.gif">
                    <p>well, this is awkward...</p>
                    <p>this page doesn't exist (yet?)...</p>
                    <p>which is kinda weird since you're looking at it right now...</p>
                    `
                    setPageTitle("page not found...", "#f55")

                    currentPage = "404"
                }
                document.title = "#" + currentPage
            }
            xhttp.open("GET", `/res/pages/${page}`);
            xhttp.send();
        }

        function setPageTitle(title, color = "#fff") {
            document.getElementById("page-address").innerHTML = ` > <span style="color:${color};">${title}</span>`
            document.getElementById("title-bar-address").children[0].setAttribute('data-label', `snapps.dev > ${title}`)
        }

        function markActive(pageName) {
            try {
                document.getElementById("side-bar").children[sidebarPages.indexOf(pageName)].classList.add("selected")

            } catch (error) {
                console.warn(`page '${pageName}' has no associated tab`)
            }
        }

        function clearSelection() {
            try {
                document.getElementsByClassName("selected")[0].classList.remove("selected")
            } catch (error) {

            }
        }

        function makePage(title, content, color = "#fff") {
            setPageTitle(title, color)
            document.getElementById("content-area").innerHTML = content;
            document.getElementsByClassName("selected")[0].classList.remove("selected")
        }

        addEventListener("popstate", (event) => {
            console.log(`current state: ${event.state}`)
            loadPage(event.state, false)
        })


        // --- preferences functions ---

        var unsavedPref = false;
        var userPrefs = {
            "cookies": false,
            "fullscreen": false,
            "freaky": false,
        }

        // cookies
        userPrefs.cookies = false; // default
        function toggleCookies() {
            if (!userPrefs.cookies) {
                if (!confirm(
                        "this setting will enable cookies to be saved. this will allow this site remember your preferences. they will be remebered for 30 days since you last visited this homepage.\n\nenable cookies?"
                        )) return
                document.getElementById("main-window").classList.add("cookies")
                userPrefs.cookies = true
            } else {
                document.getElementById("main-window").classList.remove("cookies")
                userPrefs.cookies = false
            }
            unsavedPref = true;
            savePreferences()
        }

        // fullscreen
        userPrefs.fullscreen = false; // default
        function toggleFullscreen() {
            if (!userPrefs.fullscreen) {
                document.getElementById("main-window").classList.add("fullscreen")
                userPrefs.fullscreen = true
            } else {
                document.getElementById("main-window").classList.remove("fullscreen")
                userPrefs.fullscreen = false
            }
            unsavedPref = true;
            savePreferences()
        }

        // freaky
        userPrefs.freaky = false; // default
        function toggleFreaky() {
            if (!userPrefs.freaky) {
                if (!confirm(
                        `this will toggle on 'freaky' mode!\nyou may stumble upon something weird and/or wicked!\nlike vore, or uh... mainly vore but who knows!`
                    )) return
                document.getElementById("main-window").classList.add("freaky")
                userPrefs.freaky = true
            } else {
                document.getElementById("main-window").classList.remove("freaky")
                userPrefs.freaky = false
            }
            unsavedPref = true;
            savePreferences()
        }

        function loadPrefs() {
            const prefsFound = loadCookie("userPrefs")
            if (prefsFound) userPrefs = prefsFound
            checkPrefs()
            savePreferences()
        }

        // check prefs
        function checkPrefs() {
            if (userPrefs.freaky) document.getElementById("main-window").classList.add("freaky")
            if (userPrefs.fullscreen) document.getElementById("main-window").classList.add("fullscreen")
        }

        // --- cookies n stuff ---

        function createCookie(name, data) {
            name = name.replaceAll(" ", "_")
            document.cookie = `${name}=${data}; expires=${(new Date(Date.now() + 2592000000)).toUTCString()}`;
            console.log(`new cookie '${name}' has been created!`)
        }


        // cookie data should be in a json form
        function loadCookie(name) {
            name = name.replaceAll(" ", "_")
            data = null
            const match = new RegExp(`${name}=([^;]+)(?:;|$)`);
            console.log("checking for existing preferences...")
            try {
                data = document.cookie.match(match)[1]
                console.log("cookie found!")

                try {
                    data = JSON.parse(data)
                } catch (error) {

                }
                return data
            } catch (error) {
                console.warn("cookie not found!")

            }
        }

        function savePreferences() {
            if (userPrefs.cookies) {
                console.log("saving preferences to cookies")
                createCookie("userPrefs", JSON.stringify(userPrefs))
                unsavedPref = false;
                document.getElementById("unsaved-warn-icon").style.display = "none"
            }

            if (unsavedPref) {
                document.getElementById("unsaved-warn-icon").style.display = "block"
            }

        }

        // --- silly functions ---

        function closeWindow() {
            if (confirm("are you sure you want close this window?\n\nunsaved work will be lost."))
                if (confirm("are you *really* sure you want close this window?"))
                    if (confirm("final warning!\n\nyou may regret this!"))
                        document.getElementById("main-window").remove()
        }

        // --- general functions ---
        async function setClipboard(text) {
            const type = "text/plain";
            const clipboardItemData = {
                [type]: text,
            };
            const clipboardItem = new ClipboardItem(clipboardItemData);
            await navigator.clipboard.write([clipboardItem]);
        }

        //functions to runn when updating page
        //for reloading a gallery for example
        var observer = new MutationObserver(() => {
            if (currentPage == "featured") queryGallery();
            if (currentPage == "soapbox") fetchBlogPosts();
        })
        observer.observe(document.getElementById("content-area"), {
            childList: true
        })

        // to run on load
        loadPrefs()
        history.state ? loadPage(history.state, false) : loadPage(window.location.hash.slice(1), true)
    </script>
