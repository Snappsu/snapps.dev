<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- Stuff to Import-->
    <link rel="stylesheet" href="/res/style/global.css">
    <link rel="stylesheet" href="index.css">
    <!-- Page Appearance -->
    <title>ask - snapps.dev</title>
    <link rel="icon" href="/res/img/global/embed.png">
    <link rel="apple-touch-icon" href="/res/img/global/embed.png">
    <!-- Embed Stuff -->
    <meta content="Snapps the Scalie Artist 🔞" property="og:title">
    <meta content="✨ Spreading scalie propaganda since 2020 ✨" property="og:description">
    <meta content="https://snapps.dev/" property="og:url">
    <meta content="https://snapps.dev/img/global/embed.png" property="og:image">
    <meta content="#9463ff" data-react-helmet="true" name="theme-color">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&display=swap');
    </style>
</head>

<body>

    <div style="position: absolute; top: 0; width: 100%;">
        <nav>
            <a href="/home/">Home</a>
            <a href="/ask/">Ask</a>
            <a>Journal</a>
            <a>Projects</a>
            <a>Support</a>
            <a>Commissions</a>
        </nav>
    </div>


    <datalist id="characterList">
    </datalist>

    <div id="background">

    </div>

    <div id="letter">
        <div id="letter-container">
            <div id="letter-recipient" class="letter-field">
                <h1>Recipient:</h1>
                <div class="description">To whom should this question go to? A name is not needed; A description of the
                    person could work as well. Regardless, I left some of my characters below (just for you 💖).</div>

                <input id="recipient-field" type="text" value="" list="characterList" oninput="checkRecip(this.value)"
                    placeholder="Who is the letter for?" />
                <div id="char-chips"></div>
                <div id="char-tab"></div>
            </div>
            <div id="letter-content" class="letter-field" id="ask-field">
                <h1>Question:</h1>
                <textarea maxlength="0" id="sender-question" oninput="updateCharCount(this.value)"></textarea>
                <div id="char-count"></div>
            </div>
            <div id="letter-sender" class="letter-field">
                <h1>Sender:</h1>

                <input type="text" value="" placeholder="Who is sending the letter?" />
            </div>
        </div>
    </div>

    <script src="/res/js/ask.js"></script>

</body>

</html>
