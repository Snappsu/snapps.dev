    <script>
        var currentPage = ""
        var sidebarPages = Array.from(document.getElementById("side-bar").children).map((tab) => {
            try {
                return tab.attributes.onclick.value.match(/'(.+)'/)[1]
            } catch (error) {
                return null
            }
        })

        function loadPage(page) {
            if (page == "") page = "error"
            var target = null
            if (event) target = event.target
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                if (this.status == 200) {

                    //clear selection
                    clearSelection()

                    //set page title
                    setPageTitle(page.replace("-", " "))

                    //add selection effect to sidebar 
                    markActive(page)

                    //load content
                    document.getElementById("content-area").innerHTML = this.responseText;

                    currentPage=page

                } else {
                    //clear selection
                    clearSelection()

                    //'load' 404
                    document.getElementById("content-area").innerHTML = `
                    <div id="page-bg"><h1 id="page-title" data-label="404 ERROR">404 ERROR</h1></div>
                    <img height="250px" class="floor" src="/res/img/hero/test2B.gif">
                    <p>well, this is awkward...</p>
                    <p>this page doesn't exist (yet?)...</p>
                    <p>which is kinda weird since you're looking at it right now...</p>
                    `
                    setPageTitle("page not found...", "#f55")

                    currentPage ="404"
                }
            }
            xhttp.open("GET", `/res/pages/${page}`);
            xhttp.send();
        }

        function setPageTitle(title, color = "#fff") {
            document.getElementById("page-address").innerHTML = ` > <span style="color:${color};">${title}</span>`
            document.getElementById("title-bar-address").children[0].setAttribute('data-label', `snapps.dev > ${title}`)
        }

        function markActive(pageName) {
            try {
                document.getElementById("side-bar").children[sidebarPages.indexOf(pageName)].classList.add("selected")

            } catch (error) {
                console.warn(`page '${pageName}' has no associated tab`)
            }
        }

        function clearSelection() {
            try {
                document.getElementsByClassName("selected")[0].classList.remove("selected")
            } catch (error) {

            }
        }

        function makePage(title, content, color = "#fff") {
            setPageTitle(title, color)
            document.getElementById("content-area").innerHTML = content;
            document.getElementsByClassName("selected")[0].classList.remove("selected")
        }

        var fullscreen = false;

        function toggleFullscreen() {
            if (!fullscreen) {
                document.getElementById("main-window").classList.add("fullscreen")
                fullscreen = true
            } else {
                document.getElementById("main-window").classList.remove("fullscreen")
                fullscreen = false

            }
        }

        function closeWindow() {
            if (confirm("are you sure you want close this window?\n\nunsaved work will be lost."))
                if (confirm("are you *really* sure you want close this window?"))
                    if (confirm("final warning!\n\nyou may regret this!"))
                        document.getElementById("main-window").remove()
        }

        //functions to runn when updating page
        //for reloading a gallery for example
        var observer = new MutationObserver(()=>{
            if(currentPage=="featured") queryGallery();
        })
        observer.observe(document.getElementById("content-area"), {childList: true})    

        loadPage("top")
    </script>
